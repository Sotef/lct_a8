# Предиктивный сервис АО «Москоллектор» — развёртывание всего сервиса в Docker
# (PostgreSQL 12+ + FastAPI/SPA). Связанные документы: BACKEND_SPEC.md, MOBILE_PLAN.md.
#
# Быстрый старт:
#   cd services
#   copy .env.docker.example .env      # Windows  (cp ... в bash)
#   docker compose up -d --build
#   http://127.0.0.1:8000/             — SPA (диспетчер/техник)
#   http://127.0.0.1:8000/docs         — Swagger
#
# Полезное:
#   docker compose ps                  # статус и healthcheck
#   docker compose logs -f api         # логи сервиса
#   docker compose exec api python scripts/seed.py    # обычно не нужно: делается на старте
#   docker compose down                # остановить (данные остаются в volumes)
#   docker compose down -v             # остановить и удалить БД (демо-перезапуск «с нуля»)
#
# TLS 1.2+ (требование ТЗ) — отдельный профиль:
#   docker compose --profile tls up -d --build
#   https://127.0.0.1:8443/            — сертификат см. deploy/certs (самоподписанный/корпоративный)
#
# Research-каталог (модели, справочники, журналы СМВУ) подключается read-only и в образ не копируется.

name: moscollector

x-api-env: &api-env
  # --- БД (PostgreSQL 12+; в compose — 14-alpine) ---
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-moscollector}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-moscollector}
  # --- Пути (внутри контейнера) ---
  RESEARCH_DIR: /workspace/research
  DATASET_DIR: /workspace/research/dataset
  EXTRACTED_DIR: /workspace/research/dataset/extracted
  MODELS_DIR: /workspace/research/models
  STREAM_SOURCE: /workspace/research/dataset/extracted/ext-journal-2026.csv
  LOG_DIR: /workspace/services/logs
  ATTACH_DIR: /workspace/services/data/attachments
  # --- Сервис ---
  HOST: 0.0.0.0
  PORT: "8000"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-1}
  SLOW_REQUEST_MS: ${SLOW_REQUEST_MS:-1500}
  LOG_BUFFER_SIZE: ${LOG_BUFFER_SIZE:-3000}
  LOG_FILE_MAX_MB: ${LOG_FILE_MAX_MB:-20}
  LOG_FILE_BACKUPS: ${LOG_FILE_BACKUPS:-5}
  # --- Безопасность ---
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
  ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
  REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
  MOBILE_REFRESH_DAYS: ${MOBILE_REFRESH_DAYS:-30}
  # --- Реплей демо-данных 2026 (симулированные часы) ---
  SIM_CLOCK: ${SIM_CLOCK:-1}
  SIM_YEAR: ${SIM_YEAR:-2026}
  SIM_START: ${SIM_START:-2026-01-01T00:00:00}
  SIM_TICK_REAL_SEC: ${SIM_TICK_REAL_SEC:-75}
  SIM_LOOP: ${SIM_LOOP:-1}
  RUN_SCHEDULER: ${RUN_SCHEDULER:-0}
  SHAP_TOP_K: ${SHAP_TOP_K:-400}
  # --- Живая подача из журнала (как в реальной работе) ---
  # SIM_FEED=1: на каждом тике сервис сам читает хвост грязного ext-journal-*.csv,
  # агрегирует, пересобирает признаки из накопленного кэша и инференсит текущий бакет
  SIM_FEED: ${SIM_FEED:-0}
  SIM_FEED_CHUNK: ${SIM_FEED_CHUNK:-200000}
  SIM_FEED_END: ${SIM_FEED_END:-}
  SIM_FEED_REBUILD: ${SIM_FEED_REBUILD:-1}
  SIM_FEED_WARMUP: ${SIM_FEED_WARMUP:-1}
  # --- Превентивные заявки ---
  AUTO_TICKETS: ${AUTO_TICKETS:-1}
  AUTO_TICKETS_MIN_RISK: ${AUTO_TICKETS_MIN_RISK:-0.5}
  AUTO_TICKETS_TOP_K: ${AUTO_TICKETS_TOP_K:-15}
  # --- Мобильный профиль / PWA ---
  PWA: ${PWA:-1}
  ALERTS_PUSH: ${ALERTS_PUSH:-1}
  ALERTS_MIN_P7D: ${ALERTS_MIN_P7D:-0.2}
  ALERTS_SILENCE_HOURS: ${ALERTS_SILENCE_HOURS:-12}
  ALERTS_TOP_K: ${ALERTS_TOP_K:-50}
  ATTACH_MAX_MB: ${ATTACH_MAX_MB:-5}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:ods@moscollector.ru}
  # --- Поведение entrypoint ---
  SKIP_SEED: ${SKIP_SEED:-0}
  RUN_MIGRATIONS: ${RUN_MIGRATIONS:-0}
  DB_WAIT_RETRIES: ${DB_WAIT_RETRIES:-45}

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moscollector}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-moscollector}
      # локаль для корректной сортировки кириллицы
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # только локально (админ-доступ); уберите, если БД не нужна снаружи
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moscollector} -d ${POSTGRES_DB:-moscollector}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: moscollector/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    # ВНИМАНИЕ: намеренно НЕ используем env_file, чтобы случайно не подмешать
    # dev-`services/.env` с Windows-путями (d:\...). Compose сам читает `.env`
    # в этой папке ТОЛЬКО для подстановки ${VAR} ниже — значения задаются здесь.
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # ML-артефакты и справочники research — read-only (десятки ГБ, в образ не входят)
      - ../research:/workspace/research:ro
      # Данные сервиса: панели/raw/z-stats/l2 + вложения
      - ./data:/workspace/services/data
      # Логи (JSON lines + ротация)
      - ./logs:/workspace/services/logs
    depends_on:
      postgres:
        condition: service_healthy

  # --- TLS-терминация (профиль tls; TLS 1.2+) ---
  proxy:
    image: nginx:1.27-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "${HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  pgdata:
