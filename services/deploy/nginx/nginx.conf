# Reverse-proxy с TLS-терминацией (профиль tls, ТЗ: TLS 1.2+).
# Монтируется как /etc/nginx/conf.d/default.conf.
# Сертификаты: /etc/nginx/certs/tls.crt + tls.key (см. deploy/certs/README.md)

upstream moscollector_api {
    server api:8000;
    keepalive 16;
}

# :80 — только редирект на HTTPS (порт 8443 публикуется compose-ом)
server {
    listen 80;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # фото заявок (ATTACH_MAX_MB по умолчанию 5 МБ) + запас
    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass         http://moscollector_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Connection        "";
        # SLA сервиса: инференс/пачки данных ≤ 300 с
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
